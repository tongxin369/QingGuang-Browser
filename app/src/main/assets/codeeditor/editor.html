<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="codemirror.min.css">
<link rel="stylesheet" href="theme_material-darker.min.css">
<style>
  html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #ffffff; }
  body.dark { background: #212121; }
  .CodeMirror {
    height: 100%;
    font-family: "JetBrains Mono", "Roboto Mono", monospace;
    font-size: 12px;
    line-height: 1.55;
  }
  .CodeMirror-gutters { border-right: 1px solid rgba(128, 128, 128, 0.22); }
  .CodeMirror-linenumber { padding: 0 6px 0 6px; }
  .CodeMirror-scroll { -webkit-overflow-scrolling: touch; }
  /* 尽量让系统滚动条可见；右侧还有应用内绘制的快速滑动轨道 */
  .CodeMirror-vscrollbar { width: 10px !important; }
  .CodeMirror-vscrollbar::-webkit-scrollbar { width: 8px; }
  .CodeMirror-vscrollbar::-webkit-scrollbar-thumb {
    background: rgba(128, 128, 128, 0.55);
    border-radius: 4px;
  }
  .CodeMirror-vscrollbar::-webkit-scrollbar-track { background: rgba(128, 128, 128, 0.14); }
  body.dark .CodeMirror-vscrollbar::-webkit-scrollbar-thumb { background: rgba(200, 200, 200, 0.55); }
</style>
</head>
<body>
<textarea id="code"></textarea>
<script src="codemirror.min.js"></script>
<script src="mode_xml_xml.min.js"></script>
<script src="mode_javascript_javascript.min.js"></script>
<script src="mode_css_css.min.js"></script>
<script src="mode_htmlmixed_htmlmixed.min.js"></script>
<script src="mode_markdown_markdown.min.js"></script>
<script>
  var editor = CodeMirror.fromTextArea(document.getElementById('code'), {
    lineNumbers: true,
    lineWrapping: true,
    mode: 'htmlmixed',
    indentUnit: 2,
    tabSize: 2,
    readOnly: false,
    theme: 'default',
    scrollbarStyle: 'native',
    // 全部渲染（CodeMirror 支持 Infinity），彻底消除首次滚动到未浏览区域时的卡顿
    viewportMargin: Infinity
  });

  function notifyDirty() {
    if (window.QingGuangEditor) {
      QingGuangEditor.onDirty(!editor.isClean());
    }
  }
  editor.on('change', notifyDirty);

  function reportScroll() {
    try {
      var info = editor.getScrollInfo();
      if (window.QingGuangEditor && QingGuangEditor.onScroll) {
        QingGuangEditor.onScroll(info.top, info.height, info.clientHeight);
      }
    } catch (e) {}
  }
  editor.on('scroll', reportScroll);
  editor.on('refresh', reportScroll);
  window.addEventListener('resize', function () {
    setTimeout(reportScroll, 60);
  });

  window.scrollToRatio = function (ratio) {
    var info = editor.getScrollInfo();
    var max = Math.max(0, info.height - info.clientHeight);
    var safe = Math.max(0, Math.min(1, ratio || 0));
    editor.scrollTo(null, max * safe);
    reportScroll();
  };

  // 简化的页内查找：不依赖 search 插件，返回匹配总数
  window.findNext = function (query, reset) {
    if (!query) return 0;
    var all = editor.getValue();
    var from = reset ? 0 : (window.__findIndex || 0);
    var idx = all.indexOf(query, from);
    if (idx < 0 && from > 0) idx = all.indexOf(query, 0);
    if (idx < 0) {
      window.__findIndex = 0;
      return 0;
    }
    window.__findIndex = idx + query.length;
    var fromPos = editor.posFromIndex(idx);
    var toPos = editor.posFromIndex(idx + query.length);
    editor.setSelection(fromPos, toPos);
    editor.scrollIntoView({ from: fromPos, to: toPos }, 80);
    var count = 0;
    var pos = 0;
    while ((pos = all.indexOf(query, pos)) >= 0) {
      count++;
      pos += query.length;
    }
    return count;
  };

  window.setEditor = function (text, mode, readOnly, dark) {
    editor.setOption('mode', mode || 'htmlmixed');
    editor.setOption('readOnly', !!readOnly);
    editor.setOption('theme', dark ? 'material-darker' : 'default');
    document.body.className = dark ? 'dark' : '';
    editor.setValue(text || '');
    editor.clearHistory();
    editor.markClean();
    notifyDirty();
    setTimeout(function () {
      editor.refresh();
      reportScroll();
    }, 40);
  };

  window.getCode = function () {
    return editor.getValue();
  };

  window.markClean = function () {
    editor.markClean();
    notifyDirty();
  };

  window.setDark = function (dark) {
    editor.setOption('theme', dark ? 'material-darker' : 'default');
    document.body.className = dark ? 'dark' : '';
    editor.refresh();
    reportScroll();
  };

  window.gotoLine = function (line) {
    var target = Math.max(0, (line || 1) - 1);
    editor.setCursor({ line: target, ch: 0 });
    editor.scrollIntoView({ line: target, ch: 0 }, 80);
  };
</script>
</body>
</html>
