<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>本地网页示例 · 轻光浏览器</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 20px 40px;
    background: #f7faf9;
    color: #14211f;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .sub { font-size: 13px; color: #5e6f6b; margin: 0 0 20px; }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
  }
  .label { font-size: 13px; color: #5e6f6b; margin-bottom: 8px; }
  .value { font-size: 34px; font-weight: 700; color: #0e7c86; margin-bottom: 10px; }
  button {
    border: 0;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    background: #0e7c86;
    color: #fff;
    margin: 0 8px 8px 0;
  }
  button.ghost { background: #e3ece9; color: #14211f; }
  .mono {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-all;
    background: #f2f7f5;
    border-radius: 8px;
    padding: 10px;
    margin: 8px 0 0;
    color: #2f4440;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0b1518; color: #dde7e4; }
    .sub, .label { color: #9fb2ad; }
    .card { background: #122125; box-shadow: none; }
    .value { color: #35d0ba; }
    button.ghost { background: #1d3036; color: #dde7e4; }
    .mono { background: #0f1c1f; color: #b9cdc8; }
  }
</style>
</head>
<body>
  <h1>轻光浏览器 · 本地示例页</h1>
  <p class="sub">本页通过应用内部的固定域名加载，localStorage 会长期保存，也可以被自动备份和恢复。</p>

  <div class="card">
    <div class="label">页面计数（保存在 localStorage）</div>
    <div id="count" class="value">0</div>
    <button onclick="bump()">+1 并保存</button>
    <button class="ghost" onclick="reset()">清零</button>
  </div>

  <div class="card">
    <div class="label">定位测试（首次会请求定位权限）</div>
    <button onclick="locate()">获取当前位置</button>
    <div id="geo" class="mono">尚未获取</div>
  </div>

  <div class="card">
    <div class="label">当前存储内容</div>
    <pre id="dump" class="mono">(空)</pre>
  </div>

<script>
  function read() {
    try { return JSON.parse(localStorage.getItem('demo') || '{"count":0}'); }
    catch (e) { return { count: 0 }; }
  }
  function save(o) { localStorage.setItem('demo', JSON.stringify(o)); }
  function bump() { var o = read(); o.count = (o.count || 0) + 1; save(o); render(); }
  function reset() { save({ count: 0 }); render(); }
  function render() {
    document.getElementById('count').textContent = read().count || 0;
    document.getElementById('dump').textContent = localStorage.getItem('demo') || '(空)';
  }
  function locate() {
    var out = document.getElementById('geo');
    if (!navigator.geolocation) { out.textContent = '当前环境不支持定位'; return; }
    out.textContent = '正在获取...';
    navigator.geolocation.getCurrentPosition(
      function (p) {
        out.textContent = '纬度 ' + p.coords.latitude.toFixed(6) +
          '\n经度 ' + p.coords.longitude.toFixed(6) +
          '\n精度 ' + Math.round(p.coords.accuracy) + ' 米';
      },
      function (e) { out.textContent = '获取失败：' + e.message; },
      { enableHighAccuracy: true, timeout: 15000 }
    );
  }
  document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
